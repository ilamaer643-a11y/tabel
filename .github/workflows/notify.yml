name: Telegram Payment Reminder

on:
  schedule:
    # 13:00 UTC = 16:00 по Москве. Каждый день.
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Check day and send notification
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT1: ${{ secrets.TG_CHAT1 }}
          TG_CHAT2: ${{ secrets.TG_CHAT2 }}
          FIREBASE_URL: ${{ secrets.FIREBASE_URL }}
        run: |
          # Получаем текущую дату по UTC
          DAY=$(date -u +%d)
          MONTH=$(date -u +%m)
          YEAR=$(date -u +%Y)
          
          echo "Сегодня: $DAY.$MONTH.$YEAR (UTC)"
          
          # Определяем тип выплаты
          if [ "$DAY" = "16" ]; then
            TYPE="adv"
            TITLE="💰 Напоминание об авансе"
            PERIOD="Смены с 1 по 15 число"
            DATE_STR="16.${MONTH}.${YEAR}"
            START_DAY=1
            END_DAY=15
          elif [ "$DAY" = "01" ]; then
            TYPE="sal"
            TITLE="💵 Напоминание о зарплате"
            PERIOD="Смены с 16 по конец месяца"
            DATE_STR="1.${MONTH}.${YEAR}"
            START_DAY=16
            # Получаем последний день предыдущего месяца
            LAST_DAY=$(date -u -d "$YEAR-$MONTH-01 -1 day" +%d)
            END_DAY=$LAST_DAY
          else
            echo "Сегодня не день выплаты (не 1-е и не 16-е). Выход."
            exit 0
          fi
          
          echo "Тип: $TYPE, период: $START_DAY-$END_DAY"
          
          # Скачиваем данные из Firebase
          DATA=$(curl -s "${FIREBASE_URL}/dkbz_timesheet_v2.json")
          
          if [ -z "$DATA" ] || [ "$DATA" = "null" ]; then
            echo "Нет данных в Firebase"
            exit 0
          fi
          
          # Формируем сообщение
          MESSAGE="$TITLE

Сегодня $DATE_STR — день выплаты!

$PERIOD:
━━━━━━━━━━━━━━"
          
          GRAND_TOTAL=0
          
          # Получаем список ПВЗ
          PVZ_IDS=$(echo "$DATA" | jq -r '.pvz | keys[]' 2>/dev/null)
          
          for PVZ_ID in $PVZ_IDS; do
            PVZ_NAME=$(echo "$DATA" | jq -r ".pvz[\"$PVZ_ID\"]" 2>/dev/null)
            MESSAGE="$MESSAGE

📍 $PVZ_NAME"
            
            PVZ_TOTAL=0
            
            # Получаем сотрудников этого ПВЗ
            EMP_IDS=$(echo "$DATA" | jq -r ".emp[] | select(.pvz==\"$PVZ_ID\") | .id" 2>/dev/null)
            
            for EMP_ID in $EMP_IDS; do
              EMP_NAME=$(echo "$DATA" | jq -r ".emp[] | select(.id==\"$EMP_ID\") | .name" 2>/dev/null)
              EMP_PHONE=$(echo "$DATA" | jq -r ".emp[] | select(.id==\"$EMP_ID\") | .phone // \"не указан\"" 2>/dev/null)
              EMP_BANK=$(echo "$DATA" | jq -r ".emp[] | select(.id==\"$EMP_ID\") | .bank // \"не указан\"" 2>/dev/null)
              
              # Считаем сумму за период
              AMOUNT=0
              for D in $(seq $START_DAY $END_DAY); do
                DAY_PAD=$(printf "%02d" $D)
                SHIFT_KEY="${EMP_ID}@${YEAR}-${MONTH}-${DAY_PAD}"
                SHIFT=$(echo "$DATA" | jq -r ".shifts[\"$SHIFT_KEY\"] // empty" 2>/dev/null)
                if [ -n "$SHIFT" ]; then
                  B=$(echo "$SHIFT" | jq -r '.b // 0' 2>/dev/null)
                  P=$(echo "$SHIFT" | jq -r '.p // 0' 2>/dev/null)
                  AMOUNT=$((AMOUNT + B - P))
                fi
              done
              
              if [ $AMOUNT -gt 0 ]; then
                PVZ_TOTAL=$((PVZ_TOTAL + AMOUNT))
                MESSAGE="$MESSAGE

👤 $EMP_NAME
📱 $EMP_PHONE
🏦 $EMP_BANK
💵 $AMOUNT ₽"
              fi
            done
            
            if [ $PVZ_TOTAL -gt 0 ]; then
              MESSAGE="$MESSAGE

<b>Итого по ПВЗ: $PVZ_TOTAL ₽</b>"
              GRAND_TOTAL=$((GRAND_TOTAL + PVZ_TOTAL))
            fi
          done
          
          MESSAGE="$MESSAGE

━━━━━━━━━━━━━━
💰 <b>ВСЕГО: $GRAND_TOTAL ₽</b>

<i>Не забудь проверить табель!</i>"
          
          echo "Отправляем сообщение..."
          
          # Отправляем первому
          if [ -n "$TG_CHAT1" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              -H "Content-Type: application/json" \
              -d "{\"chat_id\": \"$TG_CHAT1\", \"text\": $(echo "$MESSAGE" | jq -Rs .), \"parse_mode\": \"HTML\"}"
            echo "Отправлено чату 1"
          fi
          
          # Отправляем второму (если отличается)
          if [ -n "$TG_CHAT2" ] && [ "$TG_CHAT2" != "$TG_CHAT1" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              -H "Content-Type: application/json" \
              -d "{\"chat_id\": \"$TG_CHAT2\", \"text\": $(echo "$MESSAGE" | jq -Rs .), \"parse_mode\": \"HTML\"}"
            echo "Отправлено чату 2"
          fi
          
          echo "Готово!"
